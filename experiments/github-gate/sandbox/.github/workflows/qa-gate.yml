name: qa-gate
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to evaluate (dispatch on the PR head ref)
        required: true
permissions:
  contents: write
  pull-requests: read
jobs:
  release-qa:
    name: release-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || 'main' }}
      - name: Evaluate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa-evaluate.mjs
