name: qa-reconcile

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft release whose QA assets should be reconciled
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: qa-reconcile-${{ github.repository }}-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild shared progress from every release asset
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --experimental-strip-types packages/qa/src/github/reconcile-cli.ts
